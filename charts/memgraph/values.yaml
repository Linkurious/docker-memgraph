# Default values for the Memgraph umbrella chart.
# Sub-chart values are passed through via the 'memgraph' and 'memgraph-lab' keys.

# ──────────────────────────────────────────────
# Memgraph standalone sub-chart values
# https://github.com/memgraph/helm-charts/tree/main/charts/memgraph
# ──────────────────────────────────────────────
memgraph:
  image:
    repository: docker.io/memgraph/memgraph-mage
    # tag: ""  # defaults to sub-chart appVersion

  replicaCount: 1

  memgraphConfig:
    - "--also-log-to-stderr=true"
    - "--log-level=TRACE"
    - "--memory-limit=1536"
    - "--query-execution-timeout-sec=7200"
    - "--schema-info-enabled=true"
    - "--storage-automatic-label-index-creation-enabled=true"
    - "--metrics-address=0.0.0.0"
    - "--metrics-port=9091"
    - "--storage-automatic-edge-type-index-creation-enabled=true"
    - "--storage-enable-edges-metadata=true"

  service:
    type: ClusterIP
    enableBolt: true
    boltPort: 7687
    enableWebsocketMonitoring: false
    enableHttpMonitoring: true
    httpPortMonitoring: 9091

  persistentVolumeClaim:
    createStorageClaim: true
    storageSize: 10Gi
    createLogStorage: true
    logStorageSize: 1Gi

  resources: {}
    # limits:
    #   memory: 1794Mi
    # requests:
    #   cpu: 100m
    #   memory: 1794Mi

  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  initContainers: []

  secrets:
    enabled: false

  prometheus:
    enabled: true
    namespace: null  # null = same as Release.Namespace
    memgraphExporter:
      port: 9115
      pullFrequencySeconds: 5
      repository: docker.io/memgraph/prometheus-exporter
      tag: 0.2.1
    serviceMonitor:
      enabled: true
      kubePrometheusStackReleaseName: kube-prometheus-stack
      interval: 15s

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  nodeSelector: {}
  tolerations: []
  nodeAffinity: {}

# ──────────────────────────────────────────────
# Memgraph Lab sub-chart values
# https://github.com/memgraph/helm-charts/tree/main/charts/memgraph-lab
# ──────────────────────────────────────────────
memgraph-lab:
  image:
    repository: docker.io/memgraph/lab
    # tag: ""  # defaults to sub-chart appVersion

  replicaCount: 1

  env:
    - name: QUICK_CONNECT_MG_HOST
      # Must match the memgraph sub-chart service name.
      # When release name contains 'memgraph', Helm deduplicates to just <release-name>.
      # Default assumes release name = 'memgraph'. Adjust if using a different release name.
      value: memgraph
    - name: QUICK_CONNECT_MG_PORT
      value: "7687"

  service:
    type: ClusterIP
    port: 3000

  resources: {}

  serviceAccount:
    create: true
    annotations: {}
    name: ""

# ──────────────────────────────────────────────
# Umbrella-chart-only values (not passed to sub-charts)
# ──────────────────────────────────────────────

# Network policies
networkPolicies:
  create: true
  allowSameNamespaceIngress: true
  allowAllNamespaceIngress: false

# Traefik IngressRoute
hostPostfix: k8s.dev.linkurious.net
ingressRoute:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    secretName: wildcard-default-cert

# Init file ConfigMap (Cypher initialization script)
initFile:
  enabled: false
  data:
    init-file.cypherl: |-
      CREATE ROLE IF NOT EXISTS memadmin;
      GRANT ALL PRIVILEGES TO memadmin;
      GRANT CREATE_DELETE ON LABELS * TO memadmin;
      GRANT CREATE_DELETE ON EDGE_TYPES * TO memadmin;
