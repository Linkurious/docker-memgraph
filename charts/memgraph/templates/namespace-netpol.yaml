{{- if .Values.networkPolicies.create }}
# ── Memgraph DB ingress policy ───────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "memgraph.fullname" . }}-db
  labels:
    {{- include "memgraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "memgraph.dbSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      {{- if .Values.networkPolicies.allowSameNamespaceIngress }}
      - podSelector: {}
      {{- end }}
      {{- if .Values.networkPolicies.allowAllNamespaceIngress }}
      - namespaceSelector: {}
      {{- end }}
      ports:
      - port: {{ (index .Values "memgraph" "service" "boltPort") | default 7687 }}
        protocol: TCP
      {{- if (index .Values "memgraph" "service" "enableHttpMonitoring") }}
      - port: {{ (index .Values "memgraph" "service" "httpPortMonitoring") | default 9091 }}
        protocol: TCP
      {{- end }}
    {{- if (index .Values "memgraph" "prometheus" "enabled") }}
    # Allow Prometheus exporter to access HTTP monitoring port
    - from:
      {{- $promNs := (index .Values "memgraph" "prometheus" "namespace") }}
      {{- if and $promNs (ne ($promNs | toString) (.Release.Namespace | toString)) }}
      - podSelector:
          matchLabels:
            app: mg-exporter
        namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ $promNs }}
      {{- else }}
      - podSelector:
          matchLabels:
            app: mg-exporter
      {{- end }}
      ports:
      - port: {{ (index .Values "memgraph" "service" "httpPortMonitoring") | default 9091 }}
        protocol: TCP
    {{- end }}
{{- if (index .Values "memgraph-lab" "enabled") }}
---
# ── Memgraph Lab ingress policy ──────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "memgraph.fullname" . }}-lab
  labels:
    {{- include "memgraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "memgraph.labSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      {{- if .Values.networkPolicies.allowSameNamespaceIngress }}
      - podSelector: {}
      {{- end }}
      {{- if .Values.networkPolicies.allowAllNamespaceIngress }}
      - namespaceSelector: {}
      {{- end }}
      ports:
      - port: {{ (index .Values "memgraph-lab" "service" "port") | default 3000 }}
        protocol: TCP
  egress:
    # Allow Lab to connect to the Memgraph DB pod (Bolt protocol)
    - to:
      - podSelector:
          matchLabels:
            {{- include "memgraph.dbSelectorLabels" . | nindent 12 }}
      ports:
      - port: {{ (index .Values "memgraph" "service" "boltPort") | default 7687 }}
        protocol: TCP
{{- end }}
{{- end }}
---
{{- if and .Values.networkPolicies.create (index .Values "memgraph" "prometheus" "enabled") }}
# ── Prometheus exporter egress policy ────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "memgraph.fullname" . }}-exporter
  namespace: {{ (index .Values "memgraph" "prometheus" "namespace") | default .Release.Namespace }}
  labels:
    {{- include "memgraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: mg-exporter
  policyTypes:
    - Egress
  egress:
    - to:
      {{- $promNs := (index .Values "memgraph" "prometheus" "namespace") }}
      {{- if and $promNs (ne ($promNs | toString) (.Release.Namespace | toString)) }}
      - podSelector:
          matchLabels:
            {{- include "memgraph.dbSelectorLabels" . | nindent 12 }}
        namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Release.Namespace }}
      {{- else }}
      - podSelector:
          matchLabels:
            {{- include "memgraph.dbSelectorLabels" . | nindent 12 }}
      {{- end }}
      ports:
      - port: {{ (index .Values "memgraph" "service" "httpPortMonitoring") | default 9091 }}
        protocol: TCP
{{- end }}
